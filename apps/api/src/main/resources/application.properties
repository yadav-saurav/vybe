# Server
server.port=${PORT:4000}
server.address=${HOST:127.0.0.1}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s

# Vybe
vybe.data-dir=${VYBE_DATA_DIR:../../data}
vybe.db-path=${VYBE_DB_PATH:../../data/vybe.db}
vybe.autoseed=${VYBE_AUTOSEED:true}
# Imported audio lives in <imports-dir>/<userId>/ (git-ignored). Empty means <data-dir>/imports.
vybe.imports-dir=${VYBE_IMPORTS_DIR:}

# Uploads (POST /api/me/imports): 50 MB per file, 500 MB per request
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=500MB

# JSON: omit null optional fields (also configured in JacksonConfig)
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

# Schema (idempotent CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
