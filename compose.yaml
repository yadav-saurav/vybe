# docker compose up --build   ->  http://localhost:4000   (demo: demo@vybe.app / vybe1234)
# Vybe plays worldwide songs only: no local music catalogue is generated or shipped.
services:
  vybe:
    build: .
    ports: ["4000:4000"]
    volumes:
      - state:/app/state
    restart: unless-stopped
volumes:
  state:
